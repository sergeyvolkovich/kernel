[package]
name = "pkg_generic_interface"
version = "0.1.0"
edition = "2024"

[features]
# Хуки выделения памяти для attachable-slab-allocator поверх глобального
# аллокатора (alloc). Нужны только для host-сборок (тесты, утилиты):
# ядро в no_std обязано определить хуки само (см. src/mem.rs).
host-hooks = []

[dependencies]
acpi = "6.1.1"
attachable-slab-allocator = {git = "https://github.com/KiyanSisakhti/attachable-slab-allocator.git"}
bitflags = "2.13.2"
intrusive-collections = "0.10.3"
thiserror = { version = "2.0.21", default-features = false }
uuid = { version = "1.28.0", default-features = false }

llfree = { git = "https://github.com/luhsra/llfree-rs.git" }
heapless = { version = "0.9.3", features = ["portable-atomic"] }
spin = { version = "0.12.3", features = ["portable-atomic", "lock_api"] }
aligned_box = { version = "0.3.1", default-features = false }
talc = "5.1.1"
embedded-qr = "0.2.0"
