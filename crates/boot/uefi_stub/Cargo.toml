[package]
name = "uefi_stub"
version.workspace = true
edition.workspace = true
description = "UEFI boot stub (kernel.efi): reads ./boot_cfg.xml next to the image, loads the RLBA boot archive, builds BootInfo v3, ExitBootServices, handoff"

[dependencies]
uefi = { workspace = true, features = ["alloc", "global_allocator"] }
boot_info = { workspace = true }
boot_archive = { workspace = true }
bootcfg = { workspace = true }
font8x8 = { workspace = true }

[[bin]]
name = "uefi_stub"
path = "src/main.rs"
