[workspace]
resolver = "2"
# Структура «по признакам» (v0.20): каждый каталог — один слой
# ответственности, внутри — крейты этого слоя.
#   core/     — архитектурно-нейтральное ядро: политика и алгоритмы
#   hal/      — контракты платформы (трейты HAL), без зависимостей
#   platform/ — конкретная платформа x86_64: ISA-примитивы (arch_x86)
#               и машинная реализация контрактов (backend)
#   boot/     — загрузочная цепочка: форматы (boot_info/bootcfg) + прошивка
#   startup/  — композиционный корень: arch-независимая последовательность
#               запуска над трейтом Platform (реализация — platform/)
#   user/     — юзерспейс: userlib, init (первый сервер), rogue, pie
members = [
    "crates/core/kernel",
    "crates/core/eevdf",
    "crates/core/sched_lb",
    "crates/hal/kernel-hal",
    "crates/platform/arch_x86",
    "crates/platform/backend",
    "crates/boot/boot_info",
    "crates/boot/bootcfg",
    "crates/boot/uefi_stub",
    "crates/startup",
    "crates/user/userlib",
    "crates/user/init",
    "crates/user/rogue",
    "crates/user/pie",
]

# Хост-сборка (cargo build / cargo test без --target) — только
# переносимые библиотеки; образы (kernel/init/uefi_stub) собираются
# scripts/build_image.sh под свои цели: freestanding/UEFI бинари для
# хоста не линкуются (no_main + собственные линк-скрипты).
#
# startup НЕ входит: его host-тестовый бинарь ссылается на ядро в
# обычной (не test) конфигурации — #[global_allocator] talc требует
# llfree, поднятого платформой ДО первой аллокации, и тестовый
# рантайм падает до входа в тесты. startup проверяется сборкой
# образа (build_image.sh) и будущими интеграционными тестами.
default-members = [
    "crates/core/kernel",
    "crates/core/eevdf",
    "crates/core/sched_lb",
    "crates/hal/kernel-hal",
    "crates/boot/boot_info",
    "crates/boot/bootcfg",
    "crates/platform/arch_x86",
    "crates/user/pie",
]

# Общие настройки зависимостей для крейтов платформы.
[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.dependencies]
pkg_generic_interface = { path = "crates/core/kernel" }
kernel_hal = { path = "crates/hal/kernel-hal", package = "kernel-hal" }
boot_info = { path = "crates/boot/boot_info" }
bootcfg = { path = "crates/boot/bootcfg" }
eevdf = { path = "crates/core/eevdf" }
sched_lb = { path = "crates/core/sched_lb" }
arch_x86 = { path = "crates/platform/arch_x86" }
backend = { path = "crates/platform/backend" }

# Готовые крейты «по краям» (прошивка/форматы/железо): политика ядра — наша.
# xmas-elf: zero-copy ELF64 (загрузчик init в startup).
xmas-elf = "0.10"
# x86_64: таблицы страниц, GDT/TSS, адреса, порт I/O (backend).
x86_64 = "0.15"
# raw-cpuid: CPUID-декодинг (RDCL_NO/PCID/TSC-deadline, backend).
raw-cpuid = "11"
# uefi: EFI-биндинги заглушки (протоколы, FS, ExitBootServices).
uefi = "0.41"

# iommu-rs (VT-d / AMD-Vi): форматы таблиц + карта регистров, no_std.
# Драйвер (MMIO, последовательности включения, QI) — наш бекенд.
#
# v0.11: секция [patch] на локальный чекаут УДАЛЕНА — фиксы IVRS
# BLOCKS_OFFSET (44->48) и DTE IntCtl/IRTE-аксессоры влиты в апстрим
# sergeyvolkovich/iommu-rs; зависимость идёт прямо из git.
intel-iommu = { git = "https://github.com/sergeyvolkovich/iommu-rs.git" }
amd-iommu = { git = "https://github.com/sergeyvolkovich/iommu-rs.git" }

bitflags = "2.13.2"
spin = { version = "0.12.3", features = ["portable-atomic", "lock_api"] }
zerocopy = { version = "0.8", default-features = false }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
